<div class="form-card">
  <h2>Crear Producto</h2>

  <div class="form-group">
    <label for="nombre">Nombre</label>
    <input
      id="nombre"
      type="text"
      placeholder="Ingrese el nombre del producto"
    />
  </div>

  <div class="form-group">
    <label for="precio">Precio</label>
    <input
      id="precio"
      type="number"
      placeholder="Ingrese el precio"
    />
  </div>

  <button>Crear</button>
</div>
